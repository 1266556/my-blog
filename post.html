    <h1 class="post-page-title">我的第一篇文章标题</h1>
    <p class="post-page-date">发布于 2026-08-14</p>
    <div class="post-content">
      <p>这里是文章正文。你可以像写微信朋友圈一样，一段一段地写。</p>
      <p>第二段可以写更详细的内容。支持<b>加粗</b>、<i>斜体</i>、<a href="#">链接</a>等格式。</p>
      <h2>小标题示例</h2>
      <p>用 h2 标签可以加小标题，让文章结构更清晰。</p>
      <blockquote>引用一段话可以用 blockquote 样式。</blockquote>
      <p>复制这一段，改改文字，就能变成你自己的新文章啦。</p>
    </div>
  </article>
